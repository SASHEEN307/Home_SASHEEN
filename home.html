<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SASHÉEN</title>

<style>
body{
margin:0;
font-family:Arial;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:#d4af37;

/* ✨ خلفية خرز كريستال أزرق */
background-image: url("crystal.jpg");
background-size:cover;
background-position:center;
position:relative;
}

/* طبقة غامقة فوق الصورة */
.overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
}

.content{
position:relative;
z-index:2;
}

h1{
font-size:60px;
letter-spacing:5px;
margin:0;
}

p{
font-size:18px;
margin-top:10px;
opacity:0.8;
}

button{
margin-top:20px;
padding:12px 25px;
background:#d4af37;
color:#000;
border:none;
font-weight:bold;
border-radius:10px;
cursor:pointer;
font-size:16px;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="content">
<h1>SASHÉEN</h1>
<p>Luxury Crystal Beaded Bags Collection</p>

<button onclick="goShop()">Enter Shop ✨</button>
</div>

<script>
function goShop(){
window.location.href = "index.html";
}
</script>

</body>
</html>
