<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SASHÉEN | Luxury Fashion House</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f8f5f1;
    font-family:'Montserrat',sans-serif;
    color:#111;
    overflow-x:hidden;
}

/* NAVBAR */

nav{
    position:fixed;
    top:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:25px 70px;
    background:rgba(255,255,255,0.75);
    backdrop-filter:blur(10px);
    z-index:999;
    border-bottom:1px solid rgba(0,0,0,0.05);
}

.logo{
    font-size:42px;
    color:#c6a66b;
    font-family:'Cormorant Garamond',serif;
    letter-spacing:6px;
    font-weight:700;
}

nav a{
    text-decoration:none;
    margin-left:30px;
    color:#111;
    font-size:14px;
    letter-spacing:2px;
    transition:0.3s;
}

nav a:hover{
    color:#c6a66b;
}

/* HERO */

.hero{
    height:100vh;
    background:
    linear-gradient(rgba(0,0,0,0.45),
    rgba(0,0,0,0.45)),
    url('https://images.unsplash.com/photo-1529139574466-a303027c1d8b?q=80&w=1600');

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
}

.hero-content{
    animation:fadeUp 1.5s ease;
}

.hero h1{
    font-size:100px;
    letter-spacing:12px;
    font-family:'Cormorant Garamond',serif;
}

.hero p{
    margin-top:15px;
    font-size:18px;
    letter-spacing:4px;
}

.btn{
    display:inline-block;
    margin-top:30px;
    padding:14px 35px;
    background:#c6a66b;
    color:white;
    border-radius:40px;
    text-decoration:none;
    letter-spacing:2px;
    transition:0.4s;
}

.btn:hover{
    background:#a78750;
    transform:translateY(-5px);
}

.section{
    padding:140px 60px;
    text-align:center;
}

.section-title{
    font-size:60px;
    margin-bottom:60px;
    color:#c6a66b;
    font-family:'Cormorant Garamond',serif;
}

.products{
    display:flex;
    justify-content:center;
    gap:35px;
    flex-wrap:wrap;
}

.card{
    width:320px;
    background:white;
    border-radius:25px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,0.08);
    transition:0.5s;
}

.card:hover{
    transform:translateY(-12px);
    box-shadow:0 20px 50px rgba(0,0,0,0.15);
}

.card img{
    width:100%;
    height:380px;
    object-fit:cover;
    transition:0.5s;
}

.card:hover img{
    transform:scale(1.05);
}

.card-body{
    padding:25px;
}

.card h3{
    font-size:34px;
    font-family:'Cormorant Garamond',serif;
}

.price{
    margin-top:10px;
    color:#c6a66b;
    font-size:26px;
    font-weight:bold;
}

footer{
    background:#111;
    color:white;
    text-align:center;
    padding:40px;
    letter-spacing:3px;
}

.gold{
    color:#c6a66b;
}

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

</style>

</head>

<body>

<nav>

<div class="logo">
SASHÉEN
</div>

<div>

<a href="/">HOME</a>
<a href="/shop">SHOP</a>
<a href="/cart">CART</a>
<a href="/dashboard">DASHBOARD</a>
<a href="/about">ABOUT</a>

</div>

</nav>

{% block content %}

{% endblock %}

<footer>

<span class="gold">
Sashéen.com
</span>

— Luxury Fashion House © 2026

</footer>

</body>
</html>
