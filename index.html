<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SASHÉEN Luxury Shop</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b0b0b;
color:#d4af37;
}

header{
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
letter-spacing:2px;
border-bottom:1px solid #222;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#111;
border:1px solid #d4af37;
border-radius:15px;
padding:15px;
text-align:center;
box-shadow:0 0 10px rgba(212,175,55,0.2);
transition:0.3s;
}

.card:hover{
transform:scale(1.03);
}

.card img{
width:100%;
border-radius:10px;
height:180px;
object-fit:cover;
}

button{
background:#d4af37;
color:#000;
border:none;
padding:10px;
margin-top:10px;
cursor:pointer;
border-radius:8px;
font-weight:bold;
}

#cart{
position:fixed;
right:0;
top:0;
width:300px;
height:100%;
background:#111;
border-left:2px solid #d4af37;
padding:15px;
overflow:auto;
}

.cart-item{
border-bottom:1px solid #333;
padding:10px 0;
}

.checkout{
margin-top:20px;
background:#d4af37;
color:#000;
padding:10px;
text-align:center;
cursor:pointer;
font-weight:bold;
border-radius:8px;
}

.toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#d4af37;
color:#000;
padding:12px 20px;
border-radius:10px;
font-weight:bold;
opacity:0;
transition:0.4s;
}

.toast.show{
opacity:1;
bottom:40px;
}
</style>
</head>

<body>

<header>SASHÉEN Luxury Collection</header>

<div class="products">

<!-- 1 -->
<div class="card">
<a href="product.html?name=Red%20Crystal%20Bag&price=20&img=bag1.jpg">
<img src="bag1.jpg">
</a>
<h3>Red Crystal Bag</h3>
<p>$20</p>
<button onclick="addToCart('Red Crystal Bag',20)">Add to Cart</button>
</div>

<!-- 2 -->
<div class="card">
<a href="product.html?name=Black%20Pearl%20Bag&price=15&img=bag2.jpg">
<img src="bag2.jpg">
</a>
<h3>Black Pearl Bag</h3>
<p>$15</p>
<button onclick="addToCart('Black Pearl Bag',15)">Add to Cart</button>
</div>

<!-- 3 -->
<div class="card">
<a href="product.html?name=Blue%20Luxury%20Bag&price=25&img=bag3.jpg">
<img src="bag3.jpg">
</a>
<h3>Blue Luxury Bag</h3>
<p>$25</p>
<button onclick="addToCart('Blue Luxury Bag',25)">Add to Cart</button>
</div>

<!-- 4 -->
<div class="card">
<a href="product.html?name=Black%20Crystal%20Bag&price=30&img=bag4.jpg">
<img src="bag4.jpg">
</a>
<h3>Black Crystal Bag</h3>
<p>$30</p>
<button onclick="addToCart('Black Crystal Bag',30)">Add to Cart</button>
</div>

<!-- 5 -->
<div class="card">
<a href="product.html?name=Mini%20Pearl%20Bag&price=10&img=bag5.jpg">
<img src="bag5.jpg">
</a>
<h3>Mini Pearl Bag</h3>
<p>$10</p>
<button onclick="addToCart('Mini Pearl Bag',10)">Add to Cart</button>
</div>

<!-- 6 -->
<div class="card">
<a href="product.html?name=pink%20Glow%20Bag&price=17&img=bag6.jpg">
<img src="bag6.jpg">
</a>
<h3>pink Glow Bag</h3>
<p>$17</p>
<button onclick="addToCart('pink Glow Bag',17)">Add to Cart</button>
</div>

<!-- 7 -->
<div class="card">
<a href="product.html?name=Green%20Crystal%20Bag&price=14&img=bag7.jpg">
<img src="bag7.jpg">
</a>
<h3>Green Crystal Bag</h3>
<p>$14</p>
<button onclick="addToCart('Green Crystal Bag',14)">Add to Cart</button>
</div>

</div>

<div id="cart">
<h2>Cart</h2>
<div id="cartItems"></div>
<button class="checkout-btn" id="checkoutBtn" onclick="checkout()" style="display:none;">
    Checkout
</button>

<div id="toast" class="toast"></div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function addToCart(name, price){
cart.push({name, price});
localStorage.setItem("cart", JSON.stringify(cart));
renderCart();
showToast(name + " added ✨");
}

function renderCart(){
let box = document.getElementById("cartItems");
box.innerHTML = "";

cart.forEach((item)=>{
box.innerHTML += `<div class="cart-item">${item.name} - $${item.price}</div>`;
});
}

function showToast(msg){
let toast = document.getElementById("toast");
toast.innerText = msg;
toast.classList.add("show");

setTimeout(()=>{
toast.classList.remove("show");
},2000);
}

function checkout(){
let msg = "Order:%0A";
cart.forEach(i=>{
msg += i.name + " - $" + i.price + "%0A";
});

window.open("https://wa.me/201031026980?text=" + msg);
}

renderCart();
</script>

</body>
</html>
