{% extends "base.html" %}

{% block content %}

<section class="section">

<h2 class="section-title">
The Couture Collection
</h2>

<div class="products">

{% for id, p in products.items() %}

<div class="card">

<img src="/static/{{p.img}}">

<div class="card-body">

<h3>{{p.name}}</h3>

<div class="price">
{{p.price}}$
</div>

<a href="/add/{{id}}" class="btn">
ADD TO CART
</a>

</div>

</div>

{% endfor %}

</div>

</section>

{% endblock %}
